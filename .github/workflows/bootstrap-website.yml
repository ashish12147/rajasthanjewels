name: Publish Rajasthan Jewels MVP
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-website.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify and publish site sources
        shell: bash
        run: |
          set -euo pipefail
          test -f .site-payload.b64
          base64 --decode .site-payload.b64 > /tmp/rajasthan-jewels.tar.xz
          echo '8d75a6e0f19afe173e0430d9be100304bd25032ffe9b2e387f533d8f5f40eefb  /tmp/rajasthan-jewels.tar.xz' | sha256sum -c -
          tar -xJf /tmp/rajasthan-jewels.tar.xz
          rm -f .site-payload.b64 .github/workflows/bootstrap-website.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Publish Rajasthan Jewels website MVP'
          git push origin HEAD:main
